name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  lint:
    uses: ./.github/workflows/lint.yml

  build:
    needs: [ci, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
            machine: arm64
            compile_target: bun-darwin-arm64
          - target: darwin-x64
            runner: macos-15-intel
            machine: x86_64
            compile_target: bun-darwin-x64-baseline
          - target: linux-x64
            runner: ubuntu-22.04
            machine: x86_64
            compile_target: bun-linux-x64-baseline
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Verify native runner
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - run: >-
          bun build packages/cli/src/index.ts
          --compile
          --target=${{ matrix.compile_target }}
          --outfile dist/harnez

      - name: Smoke test server and TUI
        run: |
          ./dist/harnez server run >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:7432/health; then
              break
            fi
            sleep 0.1
          done
          curl --fail --silent http://127.0.0.1:7432/health | grep '"name":"harnez"'
          version=$(node -p "require('./package.json').version")
          test "$(./dist/harnez --version)" = "$version"
          curl --fail --silent http://127.0.0.1:7432/health | grep "\"version\":\"$version\""
          # A restart has to leave exactly one server behind, on a new pid.
          ./dist/harnez server restart
          restarted=$(curl --fail --silent http://127.0.0.1:7432/health)
          echo "$restarted" | grep '"name":"harnez"'
          restarted_pid=$(echo "$restarted" | sed 's/.*"pid":\([0-9]*\).*/\1/')
          test "$restarted_pid" != "$server_pid"
          server_pid="$restarted_pid"
          if [ "$RUNNER_OS" = Linux ]; then
            script -q -c ./dist/harnez /dev/null >tui.log 2>&1 &
          else
            script -q /dev/null ./dist/harnez >tui.log 2>&1 &
          fi
          tui_pid=$!
          sleep 2
          if ! kill -0 "$tui_pid" 2>/dev/null; then
            cat tui.log
            exit 1
          fi
          kill "$tui_pid" || true
          wait "$tui_pid" || true

      - run: >-
          bun scripts/stage-npm-package.ts
          --target ${{ matrix.target }}
          --binary dist/harnez
          --output npm-stage

      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: npm-stage/vendor/${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v7
        with:
          pattern: npm-*
          path: npm-platform

      - run: find npm-platform -path '*/bin/harnez' -exec chmod +x {} +

      - name: Verify tag matches package.json version
        run: |
          package_version="v$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF#refs/tags/}"
          test "$package_version" = "$tag"

      # Trusted publishing needs npm >=11.5.1.
      - run: npm install --global npm@11.5.1

      - run: npm publish ./npm-platform/npm-darwin-arm64 --tag darwin-arm64
      - run: npm publish ./npm-platform/npm-darwin-x64 --tag darwin-x64
      - run: npm publish ./npm-platform/npm-linux-x64 --tag linux-x64

      - run: >-
          bun scripts/stage-npm-package.ts
          --target darwin-arm64
          --target darwin-x64
          --target linux-x64
          --output npm-root

      - run: npm publish ./npm-root --tag latest
